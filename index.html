<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomoji Studio Booth</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f6f1e9;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.app{
  width:1024px;
  height:600px;
  background:#fff;
  border-radius:24px;
  box-shadow:0 20px 50px rgba(0,0,0,.15);
  display:flex;
  overflow:hidden;
}

.left{
  flex:1;
  background:#000;
  position:relative;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.logo{
  position:absolute;
  top:16px;
  left:16px;
  width:90px;
  opacity:.9;
}

.countdown{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:120px;
  color:#fff;
  background:rgba(0,0,0,.4);
  display:none;
}

.right{
  width:340px;
  padding:24px;
  background:#faf7f2;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.frame{
  background:#fff;
  border-radius:16px;
  padding:12px;
  box-shadow:inset 0 0 0 2px #e5dccd;
}

.frame canvas{
  width:100%;
  border-radius:12px;
}

button{
  width:100%;
  height:64px;
  font-size:20px;
  border:none;
  border-radius:40px;
  background:#7a5c3c;
  color:#fff;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}
</style>
</head>

<body>
<div class="app">

  <div class="left">
    <video id="video" autoplay playsinline></video>
    <img src="logo.png" class="logo">
    <div class="countdown" id="countdown">3</div>
  </div>

  <div class="right">
    <div class="frame">
      <canvas id="result" width="600" height="900"></canvas>
    </div>

    <div>
      <button id="shoot">ถ่ายรูป</button>
      <br><br>
      <button id="download" disabled>ดาวน์โหลด</button>
    </div>
  </div>

</div>

<script>
const video = document.getElementById("video");
const shootBtn = document.getElementById("shoot");
const downloadBtn = document.getElementById("download");
const countdownEl = document.getElementById("countdown");
const canvas = document.getElementById("result");
const ctx = canvas.getContext("2d");

let shots = [];

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>video.srcObject=stream);

function countdown(){
  return new Promise(res=>{
    let n=3;
    countdownEl.style.display="flex";
    countdownEl.textContent=n;
    const i=setInterval(()=>{
      n--;
      if(n===0){
        clearInterval(i);
        countdownEl.style.display="none";
        res();
      }else{
        countdownEl.textContent=n;
      }
    },1000);
  });
}

shootBtn.onclick = async ()=>{
  shootBtn.disabled=true;
  shots=[];

  for(let i=0;i<3;i++){
    await countdown();
    const temp=document.createElement("canvas");
    temp.width=600;
    temp.height=450;
    temp.getContext("2d").drawImage(video,0,0,600,450);
    shots.push(temp);
    await new Promise(r=>setTimeout(r,300));
  }

  drawResult();
  downloadBtn.disabled=false;
  shootBtn.disabled=false;
};

function drawResult(){
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,600,900);

  shots.forEach((c,i)=>{
    ctx.drawImage(c,40,40+i*280,520,240);
  });

  ctx.fillStyle="#7a5c3c";
  ctx.font="24px sans-serif";
  ctx.textAlign="center";
  ctx.fillText("Tomoji Studio",300,860);
}

downloadBtn.onclick=()=>{
  const a=document.createElement("a");
  a.download="tomoji-photo.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMOPHOTO</title>

<style>
:root{
  --cream:#f6f2ed;
  --paper:#fffdfa;
  --brown:#6b4b35;
  --brown-soft:#c8b19a;
  --line:#e6dccf;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:var(--brown);
}

/* ===== BOOTH ===== */
.booth{
  width:420px;
  background:var(--paper);
  border-radius:26px;
  padding:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
}

/* ===== HEADER ===== */
.header{
  text-align:center;
}
.header h1{
  margin:6px 0 2px;
  font-weight:500;
  letter-spacing:3px;
}
.header p{
  margin:0;
  font-size:13px;
  color:#9b8570;
}

/* ===== CAMERA ===== */
.camera-wrap{
  margin-top:12px;
  padding:10px;
  background:#f3eee8;
  border-radius:20px;
}

.camera-frame{
  border:4px solid var(--brown);
  border-radius:18px;
  overflow:hidden;
}

video{
  width:100%;
  display:block;
}

/* ===== COUNTDOWN ===== */
.countdown{
  height:64px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:56px;
  font-weight:600;
}

/* ===== BUTTONS ===== */
.actions{
  display:flex;
  justify-content:center;
  gap:12px;
}

button{
  background:var(--brown);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:14px 26px;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 6px 0 #4e3426;
  transition:.15s;
}

button:active{
  transform:translateY(3px);
  box-shadow:0 3px 0 #4e3426;
}

button.secondary{
  background:var(--brown-soft);
  box-shadow:0 6px 0 #a48b74;
}

button:disabled{
  opacity:.5;
  box-shadow:none;
  cursor:not-allowed;
}

/* ===== RESULT ===== */
.result{
  margin-top:16px;
  background:#f3eee8;
  padding:16px;
  border-radius:20px;
}

.photo-frame{
  background:#fff;
  padding:12px;
  border-radius:14px;
  box-shadow:inset 0 0 0 2px var(--line);
}

.photo-frame img{
  width:100%;
  border-radius:10px;
  border:4px solid #fff;
  box-shadow:0 8px 22px rgba(0,0,0,.18);
}

/* ===== DOWNLOAD ===== */
.download{
  display:block;
  margin:14px auto 0;
  width:70%;
  text-align:center;
  background:var(--brown-soft);
  color:#fff;
  padding:10px 0;
  border-radius:999px;
  text-decoration:none;
  font-size:15px;
  opacity:.4;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="booth">
  <div class="header">
    <h1>TOMOPHOTO</h1>
    <p>self photo booth</p>
  </div>

  <div class="camera-wrap">
    <div class="camera-frame">
      <video id="video" autoplay playsinline></video>
    </div>
  </div>

  <div class="countdown" id="countdown"></div>

  <div class="actions">
    <button id="startBtn">ถ่ายรูป</button>
    <button id="resetBtn" class="secondary">รีเซต</button>
  </div>

  <div class="result">
    <div class="photo-frame">
      <img id="resultImg">
    </div>
    <a id="downloadBtn" class="download" download="TOMOPHOTO.png">
      ดาวน์โหลดรูป
    </a>
  </div>
</div>

<canvas id="canvas" hidden></canvas>
<canvas id="finalCanvas" hidden></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const finalCanvas = document.getElementById("finalCanvas");
const countdownEl = document.getElementById("countdown");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const resultImg = document.getElementById("resultImg");
const downloadBtn = document.getElementById("downloadBtn");

let shots = [];

/* ===== CAMERA ===== */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s)
.catch(()=>alert("ไม่สามารถเปิดกล้องได้"));

/* ===== COUNTDOWN ===== */
function countdown(sec){
  return new Promise(res=>{
    let n = sec;
    countdownEl.textContent = n;
    const t = setInterval(()=>{
      n--;
      countdownEl.textContent = n>0?n:"";
      if(n<=0){
        clearInterval(t);
        res();
      }
    },1000);
  });
}

/* ===== SNAP ===== */
function snap(){
  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0);
  shots.push(canvas.toDataURL("image/png"));
}

/* ===== BUILD FINAL ===== */
async function buildFinal(){
  const ctx = finalCanvas.getContext("2d");
  finalCanvas.width = 420;
  finalCanvas.height = 1200;

  ctx.fillStyle="#fffdfa";
  ctx.fillRect(0,0,420,1200);

  const imgs = await Promise.all(
    shots.map(src=>new Promise(r=>{
      const i=new Image();
      i.onload=()=>r(i);
      i.src=src;
    }))
  );

  imgs.forEach((img,i)=>{
    ctx.drawImage(img,30,40+i*360,360,300);
    ctx.strokeStyle="#e0d5c7";
    ctx.lineWidth=2;
    ctx.strokeRect(30,40+i*360,360,300);
  });

  ctx.fillStyle="#6b4b35";
  ctx.font="20px sans-serif";
  ctx.textAlign="center";
  ctx.fillText("TOMOPHOTO",210,1160);

  const url = finalCanvas.toDataURL("image/png");
  resultImg.src = url;
  downloadBtn.href = url;
  downloadBtn.style.opacity="1";
  downloadBtn.style.pointerEvents="auto";
}

/* ===== FLOW ===== */
startBtn.onclick = async ()=>{
  shots=[];
  startBtn.disabled=true;
  downloadBtn.style.opacity=".4";
  downloadBtn.style.pointerEvents="none";
  resultImg.src="";

  for(let i=0;i<3;i++){
    await countdown(3);
    snap();
  }

  await buildFinal();
  startBtn.disabled=false;
};

/* ===== RESET ===== */
resetBtn.onclick = ()=>{
  shots=[];
  resultImg.src="";
  countdownEl.textContent="";
  downloadBtn.style.opacity=".4";
  downloadBtn.style.pointerEvents="none";
};
</script>

</body>
</html>

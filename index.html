<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMOPHOTO KIOSK</title>

<style>
/* =========================================================
   THEME
========================================================= */
:root{
    --bg:#f6f4f1;
    --ink:#1f1f1f;
    --soft:#b8ada3;
    --line:#e3ddd6;
    --accent:#8d7a6a;
}

/* =========================================================
   RESET + FONT
========================================================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
        "SF Pro Display",
        "Helvetica Neue",
        "Inter",
        system-ui,
        sans-serif;
    font-weight:300;
    user-select:none;
}

body{
    width:100vw;
    height:100vh;
    background:#000;
    overflow:hidden;
}

/* =========================================================
   SCREENS
========================================================= */
.screen{
    position:absolute;
    inset:0;
    background:var(--bg);
    display:none;
}
.screen.active{
    display:flex;
}

/* =========================================================
   IDLE SCREEN
========================================================= */
#idle{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:24px;
}

#idle h1{
    font-size:42px;
    letter-spacing:10px;
}
#idle p{
    font-size:16px;
    opacity:.6;
}
.idle-btn{
    margin-top:30px;
    width:140px;
    height:140px;
    border-radius:50%;
    border:2px solid var(--accent);
    background:white;
    font-size:14px;
}

/* =========================================================
   BOOTH LAYOUT
========================================================= */
#booth{
    flex-direction:column;
}

.header{
    height:70px;
    padding:0 32px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--line);
}
.header h1{
    font-size:20px;
    letter-spacing:6px;
}
.header span{
    font-size:12px;
    opacity:.5;
}

/* =========================================================
   MAIN
========================================================= */
.main{
    flex:1;
    display:grid;
    grid-template-columns: 1.2fr 1fr;
    gap:24px;
    padding:24px 32px;
}

/* =========================================================
   CAMERA
========================================================= */
.camera{
    background:black;
    border-radius:20px;
    overflow:hidden;
    position:relative;
}
video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
}

.countdown{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:160px;
    color:white;
    background:rgba(0,0,0,.4);
}

/* =========================================================
   SIDE
========================================================= */
.side{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.state{
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
}
.state h2{
    font-size:18px;
    letter-spacing:4px;
}
.state p{
    font-size:13px;
    opacity:.6;
    margin-top:6px;
}
.step{
    font-size:64px;
    margin-top:12px;
}

/* =========================================================
   PREVIEW
========================================================= */
.preview{
    display:flex;
    gap:10px;
    margin-top:16px;
}
.preview div{
    flex:1;
    aspect-ratio:3/4;
    background:#eee;
    border-radius:14px;
    overflow:hidden;
}
.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================================================
   CONTROLS
========================================================= */
.controls{
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding-top:12px;
}

.btn{
    width:80px;
    height:80px;
    border-radius:50%;
    border:1px solid var(--line);
    background:white;
    font-size:11px;
}
.btn.main{
    border:2px solid var(--accent);
    box-shadow:0 0 0 8px rgba(141,122,106,.18);
}
.btn:disabled{
    opacity:.3;
}

/* =========================================================
   RESULT STRIP (HIDDEN CANVAS)
========================================================= */
canvas{
    display:none;
}
</style>
</head>

<body>

<!-- ======================================================
     IDLE SCREEN
====================================================== -->
<div class="screen active" id="idle">
    <h1>TOMOPHOTO</h1>
    <p>Touch to start</p>
    <button class="idle-btn" id="enter">START</button>
</div>

<!-- ======================================================
     BOOTH SCREEN
====================================================== -->
<div class="screen" id="booth">

    <div class="header">
        <h1>TOMOPHOTO</h1>
        <span id="status">READY</span>
    </div>

    <div class="main">

        <div class="camera">
            <video id="video" autoplay playsinline></video>
            <div class="flash" id="flash"></div>
            <div class="countdown" id="countdown">3</div>
        </div>

        <div class="side">
            <div class="state">
                <h2 id="state">READY</h2>
                <p id="hint">Get ready in the frame</p>
                <div class="step" id="step">—</div>

                <div class="preview">
                    <div><img id="p1"></div>
                    <div><img id="p2"></div>
                    <div><img id="p3"></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn main" id="shoot">SHOT</button>
                <button class="btn" id="img" disabled>IMAGE</button>
                <button class="btn" id="vid" disabled>VIDEO</button>
                <button class="btn" id="reset" disabled>RESET</button>
            </div>
        </div>

    </div>
</div>

<canvas id="strip"></canvas>

<script>
/* =========================================================
   ELEMENTS
========================================================= */
const idle = document.getElementById("idle");
const booth = document.getElementById("booth");

const video = document.getElementById("video");
const flash = document.getElementById("flash");
const countdown = document.getElementById("countdown");

const stateEl = document.getElementById("state");
const stepEl = document.getElementById("step");

const previews = [
    document.getElementById("p1"),
    document.getElementById("p2"),
    document.getElementById("p3")
];

const shootBtn = document.getElementById("shoot");
const imgBtn = document.getElementById("img");
const vidBtn = document.getElementById("vid");
const resetBtn = document.getElementById("reset");

const strip = document.getElementById("strip");
const sctx = strip.getContext("2d");

const temp = document.createElement("canvas");
const tctx = temp.getContext("2d");

let shots = [];
const TOTAL = 3;

/* =========================================================
   CAMERA
========================================================= */
navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(s => video.srcObject = s);

/* =========================================================
   FLOW
========================================================= */
const sleep = ms => new Promise(r=>setTimeout(r,ms));

document.getElementById("enter").onclick = ()=>{
    idle.classList.remove("active");
    booth.classList.add("active");
};

async function shoot(){
    shots=[];
    previews.forEach(p=>p.src="");
    imgBtn.disabled = true;
    vidBtn.disabled = true;
    resetBtn.disabled = true;

    stateEl.textContent="SHOOTING";

    for(let i=0;i<TOTAL;i++){
        stepEl.textContent=i+1;
        countdown.style.display="flex";

        for(let n=3;n>0;n--){
            countdown.textContent=n;
            await sleep(1000);
        }

        countdown.style.display="none";
        flash.style.opacity=1;
        await sleep(120);
        flash.style.opacity=0;

        temp.width = video.videoWidth;
        temp.height = video.videoHeight;
        tctx.drawImage(video,0,0);

        shots.push(temp.toDataURL("image/png"));
        previews[i].src = shots[i];

        await sleep(400);
    }

    buildStrip();
    stateEl.textContent="DONE";
    stepEl.textContent="✓";
    imgBtn.disabled=false;
    vidBtn.disabled=false;
    resetBtn.disabled=false;
}

function buildStrip(){
    const w = temp.width;
    const h = temp.height;
    const pad = 30;
    const head = 120;

    strip.width = w + pad*2;
    strip.height = head + h*TOTAL + pad*(TOTAL+1);

    sctx.fillStyle="#fff";
    sctx.fillRect(0,0,strip.width,strip.height);

    sctx.fillStyle="#1f1f1f";
    sctx.font="300 40px 'SF Pro Display','Helvetica Neue'";
    sctx.textAlign="center";
    sctx.fillText("TOMOPHOTO", strip.width/2, 80);

    shots.forEach((src,i)=>{
        const img = new Image();
        img.onload = ()=>{
            const y = head + pad + i*(h+pad);
            sctx.drawImage(img,pad,y,w,h);
        };
        img.src = src;
    });
}

/* =========================================================
   DOWNLOAD IMAGE
========================================================= */
imgBtn.onclick = ()=>{
    const a = document.createElement("a");
    a.href = strip.toDataURL("image/png");
    a.download = "TOMOPHOTO.png";
    a.click();
};

/* =========================================================
   VIDEO (MP4 preferred)
========================================================= */
vidBtn.onclick = async ()=>{
    const stream = strip.captureStream(30);
    let recorder;
    let chunks=[];

    try{
        recorder = new MediaRecorder(stream,{mimeType:"video/mp4"});
    }catch{
        recorder = new MediaRecorder(stream,{mimeType:"video/webm"});
    }

    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.start();

    await sleep(3000);
    recorder.stop();

    recorder.onstop = ()=>{
        const blob = new Blob(chunks,{type:recorder.mimeType});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = recorder.mimeType.includes("mp4") ? "TOMOPHOTO.mp4" : "TOMOPHOTO.webm";
        a.click();
    };
};

/* =========================================================
   RESET
========================================================= */
resetBtn.onclick = ()=>{
    location.reload();
};

shootBtn.onclick = shoot;
</script>

</body>
</html>

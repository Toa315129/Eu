<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMOPHOTO BOOTH</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f3ece5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#5b3a29;
}

.booth{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
  text-align:center;
}

h1{
  margin:8px 0 12px;
  letter-spacing:2px;
  font-size:20px;
}

.preview{
  position:relative;
}

video{
  width:100%;
  border-radius:14px;
  border:4px solid #5b3a29;
  background:#000;
}

.countdown{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:96px;
  font-weight:600;
  color:#fff;
  background:rgba(0,0,0,.4);
  border-radius:14px;
}

/* ===== BOOTH BUTTON ===== */
.controls{
  margin-top:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:24px;
}

.booth-btn{
  width:110px;
  height:110px;
  border-radius:50%;
  border:none;
  background:#7a5c3c;
  color:#fff;
  font-size:16px;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:
    0 8px 0 #5a402a,
    0 16px 30px rgba(0,0,0,.25);
  transition:.12s;
}

.booth-btn:active{
  transform:translateY(6px);
  box-shadow:
    0 2px 0 #5a402a,
    0 6px 12px rgba(0,0,0,.25);
}

.booth-btn.small{
  width:64px;
  height:64px;
  font-size:14px;
  background:#b8a38c;
  box-shadow:
    0 5px 0 #8d7a64,
    0 10px 20px rgba(0,0,0,.2);
}

.shots{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:14px 0;
}

.shots img{
  width:80px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
  border:3px solid #5b3a29;
  background:#eee;
}

.download{
  display:inline-block;
  padding:10px 20px;
  border-radius:999px;
  background:#6f533f;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  opacity:.4;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="booth">
  <h1>TOMOPHOTO</h1>

  <div class="preview">
    <video id="video" autoplay playsinline></video>
    <div class="countdown" id="countdown">3</div>
  </div>

  <canvas id="canvas" hidden></canvas>
  <canvas id="finalCanvas" hidden></canvas>

  <div class="controls">
    <button id="switchBtn" class="booth-btn small">↺</button>
    <button id="takeBtn" class="booth-btn">TAKE</button>
    <button id="downloadBtn" class="booth-btn small">↓</button>
  </div>

  <div class="shots">
    <img id="s1"><img id="s2"><img id="s3">
  </div>

  <a id="downloadLink" class="download" download="TOMOPHOTO.png">
    DOWNLOAD
  </a>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const finalCanvas = document.getElementById("finalCanvas");
const countdownEl = document.getElementById("countdown");

const takeBtn = document.getElementById("takeBtn");
const switchBtn = document.getElementById("switchBtn");
const downloadBtn = document.getElementById("downloadBtn");
const downloadLink = document.getElementById("downloadLink");

const shotsImg = [
  document.getElementById("s1"),
  document.getElementById("s2"),
  document.getElementById("s3")
];

let devices=[], camIndex=0, stream=null, shots=[];

async function startCamera(){
  devices = (await navigator.mediaDevices.enumerateDevices())
    .filter(d=>d.kind==="videoinput");

  if(!devices.length){ alert("ไม่พบกล้อง"); return; }

  stream = await navigator.mediaDevices.getUserMedia({
    video:{deviceId:devices[camIndex].deviceId}
  });
  video.srcObject = stream;
}

switchBtn.onclick = async ()=>{
  camIndex = (camIndex+1)%devices.length;
  if(stream) stream.getTracks().forEach(t=>t.stop());
  await startCamera();
};

function countdown(){
  return new Promise(res=>{
    let n=3;
    countdownEl.textContent=n;
    countdownEl.style.display="flex";
    const i=setInterval(()=>{
      n--;
      if(n===0){
        clearInterval(i);
        countdownEl.style.display="none";
        res();
      }else{
        countdownEl.textContent=n;
      }
    },1000);
  });
}

takeBtn.onclick = async ()=>{
  takeBtn.disabled=true;
  shots=[];

  for(let i=0;i<3;i++){
    await countdown();
    snap(i);
    await new Promise(r=>setTimeout(r,300));
  }

  buildFinal();
  takeBtn.disabled=false;
};

function snap(i){
  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0);
  const img = canvas.toDataURL("image/png");
  shotsImg[i].src = img;
  shots.push(img);
}

function buildFinal(){
  const ctx = finalCanvas.getContext("2d");
  finalCanvas.width = 600;
  finalCanvas.height = 900;

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,600,900);

  shots.forEach((src,i)=>{
    const im=new Image();
    im.onload=()=>ctx.drawImage(im,50,50+i*260,500,220);
    im.src=src;
  });

  ctx.fillStyle="#5b3a29";
  ctx.font="24px sans-serif";
  ctx.textAlign="center";
  ctx.fillText("TOMOPHOTO",300,860);

  setTimeout(()=>{
    downloadLink.href = finalCanvas.toDataURL("image/png");
    downloadLink.style.opacity="1";
    downloadLink.style.pointerEvents="auto";
  },500);
}

downloadBtn.onclick=()=>downloadLink.click();

startCamera();
</script>

</body>
</html>

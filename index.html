<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMOPHOTO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%}
body{
  font-family:'Inter',system-ui;
  background:#111;
  overflow:hidden;
}

:root{
  --cream:#f7f4ef;
  --sand:#efe6da;
  --brown:#8a6f5a;
  --line:#e2dad1;
  --ink:#2a2a2a;
}

/* ===== screen ===== */
.screen{position:absolute;inset:0;background:var(--cream);display:none}
.screen.active{display:flex}

/* ===== idle ===== */
#idle{
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
}
#idle h1{
  font-weight:300;
  letter-spacing:14px;
  font-size:46px;
}
.touch{
  width:160px;height:160px;
  border-radius:50%;
  border:2px solid var(--brown);
  display:flex;
  align-items:center;
  justify-content:center;
  letter-spacing:2px;
  animation:pulse 3s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(138,111,90,.3)}
  70%{box-shadow:0 0 0 40px rgba(138,111,90,0)}
}

/* ===== select ===== */
.select{
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:30px;
}
.select h2{font-weight:300;letter-spacing:6px}
.options{display:flex;gap:24px}
.option{
  width:140px;height:180px;
  border-radius:22px;
  border:1px solid var(--line);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
}
.option.active{border:2px solid var(--brown)}

/* ===== booth ===== */
#booth{flex-direction:column}
.header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid var(--line);
}
.header h1{font-weight:300;letter-spacing:6px}

.main{
  flex:1;
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
  padding:20px;
}
.camera{
  background:#000;
  border-radius:22px;
  overflow:hidden;
  position:relative;
}
video{width:100%;height:100%;object-fit:cover}
.flash{position:absolute;inset:0;background:#fff;opacity:0}
.countdown{
  position:absolute;inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:160px;
  color:#fff;
  background:rgba(0,0,0,.4);
}

.side{display:flex;flex-direction:column;justify-content:space-between}
.preview{display:grid;gap:10px}
.slot{
  background:var(--sand);
  border-radius:16px;
  padding:6px;
}
.slot img{width:100%;border-radius:12px}

/* ===== buttons ===== */
.controls{display:flex;flex-direction:column;gap:14px}
.btn{
  all:unset;
  height:56px;
  border-radius:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border:1px solid var(--line);
}
.btn.primary{
  height:72px;
  border-radius:36px;
  border:2px solid var(--brown);
}
.btn[disabled]{opacity:.4}

/* ===== printer effect ===== */
#result{
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
}
.printer{
  position:relative;
  width:360px;
  height:520px;
}
.printer .slot{
  width:240px;
  height:16px;
  background:#444;
  margin:0 auto;
  border-radius:0 0 8px 8px;
}
.paper{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%) translateY(-420px);
  width:300px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
  overflow:hidden;
  animation:printOut 3s ease-out forwards;
}
.paper canvas{width:100%}

@keyframes printOut{
  0%{transform:translateX(-50%) translateY(-420px)}
  60%{transform:translateX(-50%) translateY(20px)}
  100%{transform:translateX(-50%) translateY(0)}
}

canvas{display:none}
</style>
</head>

<body>

<!-- IDLE -->
<div class="screen active" id="idle">
  <h1>TOMOPHOTO</h1>
  <div class="touch" id="enter">START</div>
</div>

<!-- SELECT COUNT -->
<div class="screen select" id="selectCount">
  <h2>SELECT PHOTOS</h2>
  <div class="options">
    <div class="option" data-count="2">2</div>
    <div class="option active" data-count="4">4</div>
    <div class="option" data-count="6">6</div>
  </div>
</div>

<!-- SELECT FILTER -->
<div class="screen select" id="selectFilter">
  <h2>FILTER</h2>
  <div class="options">
    <div class="option active" data-filter="none">CLEAN</div>
    <div class="option" data-filter="brightness(1.1) saturate(1.1)">BEACH</div>
    <div class="option" data-filter="sepia(.25)">FILM</div>
  </div>
</div>

<!-- BOOTH -->
<div class="screen" id="booth">
  <div class="header"><h1>TOMOPHOTO</h1></div>
  <div class="main">
    <div class="camera">
      <video id="video" autoplay playsinline></video>
      <div class="flash" id="flash"></div>
      <div class="countdown" id="countdown">3</div>
    </div>
    <div class="side">
      <div class="preview" id="preview"></div>
      <div class="controls">
        <button class="btn primary" id="shoot">● ถ่ายรูป</button>
        <button class="btn" id="save" disabled>บันทึกรูป</button>
      </div>
    </div>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="result">
  <div class="printer">
    <div class="slot"></div>
    <div class="paper">
      <canvas id="strip"></canvas>
    </div>
  </div>
  <button class="btn" onclick="location.reload()">เริ่มใหม่</button>
</div>

<script>
let count=4,shots=[];
const video=document.getElementById("video");
const preview=document.getElementById("preview");
const strip=document.getElementById("strip");
const ctx=strip.getContext("2d");
const countdown=document.getElementById("countdown");
const flash=document.getElementById("flash");

navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(s=>video.srcObject=s);

enter.onclick=()=>{idle.classList.remove("active");selectCount.classList.add("active")};

document.querySelectorAll("[data-count]").forEach(o=>{
  o.onclick=()=>{
    count=+o.dataset.count;
    selectCount.classList.remove("active");
    selectFilter.classList.add("active");
  };
});

document.querySelectorAll("[data-filter]").forEach(o=>{
  o.onclick=()=>{
    video.style.filter=o.dataset.filter;
    selectFilter.classList.remove("active");
    booth.classList.add("active");
    preview.innerHTML="";
    preview.style.gridTemplateColumns=`repeat(${Math.min(count,3)},1fr)`;
    for(let i=0;i<count;i++){
      const d=document.createElement("div");
      d.className="slot";
      d.innerHTML="<img>";
      preview.appendChild(d);
    }
  };
});

shoot.onclick=async()=>{
  shots=[];
  const imgs=preview.querySelectorAll("img");
  for(let i=0;i<count;i++){
    countdown.style.display="flex";
    for(let j=3;j>0;j--){countdown.textContent=j;await sleep(1000)}
    countdown.style.display="none";
    flash.style.opacity=1;await sleep(120);flash.style.opacity=0;

    const c=document.createElement("canvas");
    c.width=video.videoWidth;
    c.height=video.videoHeight;
    c.getContext("2d").drawImage(video,0,0);
    shots.push(c);
    imgs[i].src=c.toDataURL("image/jpeg",0.8);
  }
  buildStrip();
};

function buildStrip(){
  const w=shots[0].width,h=shots[0].height;
  strip.width=w+80;
  strip.height=h*count+200;

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,strip.width,strip.height);

  ctx.fillStyle="#2a2a2a";
  ctx.font="300 36px Inter";
  ctx.textAlign="center";
  ctx.fillText("TOMOPHOTO",strip.width/2,60);

  shots.forEach((c,i)=>{
    const y=120+i*h;
    ctx.strokeStyle="#8a6f5a";
    ctx.strokeRect(34,y-6,w+12,h+12);
    ctx.drawImage(c,40,y,w,h);
  });

  ctx.font="300 14px Inter";
  ctx.fillText(new Date().toLocaleString(),strip.width/2,strip.height-20);

  booth.classList.remove("active");
  result.classList.add("active");
}

save.onclick=()=>{
  strip.toBlob(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download="TOMOPHOTO.png";
    a.click();
  });
};

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
</script>

</body>
</html>

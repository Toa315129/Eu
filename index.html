<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMOPHOTO</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#eaf6fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* ตัวตู้ */
.booth{
  width:430px;
  background:#fff;
  border-radius:22px;
  padding:16px;
  box-shadow:0 20px 40px rgba(0,0,0,.18);
}

/* หัว */
.header{
  text-align:center;
  font-size:13px;
  color:#444;
  margin-bottom:8px;
  letter-spacing:1px;
}

/* จอกล้อง */
.screen{
  position:relative;
  border-radius:18px;
  overflow:hidden;
  background:#000;
}

video{
  width:100%;
  display:block;
}

/* เลขนับ */
.countdown{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:72px;
  font-weight:600;
  color:white;
  background:rgba(0,0,0,.35);
  display:none;
}

/* ตัวอย่างรูป */
.previews{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.preview{
  width:30%;
  aspect-ratio:3/4;
  border-radius:10px;
  border:2px solid #ddd;
  background:#f5f5f5;
  overflow:hidden;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ปุ่ม */
.controls{
  display:flex;
  justify-content:center;
  margin-top:14px;
}

.shutter{
  width:72px;
  height:72px;
  border-radius:50%;
  background:white;
  border:6px solid #e0e0e0;
  cursor:pointer;
}

.shutter:active{
  transform:scale(.95);
}
</style>
</head>

<body>

<div class="booth">
  <div class="header">TOMOPHOTO</div>

  <div class="screen">
    <video id="video" autoplay playsinline></video>
    <div class="countdown" id="countdown">3</div>
  </div>

  <div class="previews">
    <div class="preview"><img id="p1"></div>
    <div class="preview"><img id="p2"></div>
    <div class="preview"><img id="p3"></div>
  </div>

  <div class="controls">
    <div class="shutter" id="shutter"></div>
  </div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const countdown = document.getElementById("countdown");
const shutter = document.getElementById("shutter");
const previews = [
  document.getElementById("p1"),
  document.getElementById("p2"),
  document.getElementById("p3")
];

let shot = 0;

navigator.mediaDevices.getUserMedia({video:true})
.then(stream => video.srcObject = stream);

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function takePhoto(){
  if(shot>=3) return;
  countdown.style.display="flex";

  for(let i=3;i>0;i--){
    countdown.textContent=i;
    await sleep(700);
  }

  countdown.style.display="none";

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0);
  previews[shot].src = canvas.toDataURL("image/png");
  shot++;
}

shutter.onclick = takePhoto;
</script>

</body>
</html>

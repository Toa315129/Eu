<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMOPHOTO – Beach Booth</title>

<style>
/* ===================================================
   THEME – MUJI BEACH
=================================================== */
:root{
    --cream:#f7f4ef;
    --sand:#e8dfd3;
    --brown:#8a6f5a;
    --brown-soft:#b8a89a;
    --ink:#2a2a2a;
    --line:#e2dbd2;
}

/* ===================================================
   RESET + FONT (THIN)
=================================================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
      "SF Pro Display",
      "Helvetica Neue",
      "Inter",
      system-ui,
      sans-serif;
    font-weight:300;
    user-select:none;
}

body{
    width:100vw;
    height:100vh;
    background:#111;
    overflow:hidden;
}

/* ===================================================
   SCREENS
=================================================== */
.screen{
    position:absolute;
    inset:0;
    background:var(--cream);
    display:none;
}
.screen.active{ display:flex; }

/* ===================================================
   IDLE
=================================================== */
#idle{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:22px;
}
#idle h1{
    letter-spacing:12px;
    font-size:44px;
}
#idle p{
    opacity:.6;
}
#idle .wave{
    width:140px;
    height:140px;
    border-radius:50%;
    border:2px solid var(--brown);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:pulse 3s infinite;
}
@keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(138,111,90,.3);}
    70%{ box-shadow:0 0 0 25px rgba(138,111,90,0);}
}

/* ===================================================
   BOOTH
=================================================== */
#booth{
    flex-direction:column;
}

/* HEADER */
.header{
    height:64px;
    padding:0 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--line);
}
.header h1{
    font-size:20px;
    letter-spacing:6px;
}
.header span{
    font-size:12px;
    opacity:.6;
}

/* MAIN */
.main{
    flex:1;
    display:grid;
    grid-template-columns:1.2fr 1fr;
    gap:22px;
    padding:22px 28px;
}

/* CAMERA */
.camera{
    background:#000;
    border-radius:20px;
    overflow:hidden;
    position:relative;
}
video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* warm overlay */
.camera::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at top,
        rgba(255,230,200,.15),
        rgba(0,0,0,0));
    pointer-events:none;
}

.flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
}

.countdown{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:150px;
    color:white;
    background:rgba(0,0,0,.4);
}

/* SIDE */
.side{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.state{
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
}
.state h2{
    font-size:18px;
    letter-spacing:4px;
}
.state p{
    font-size:13px;
    opacity:.6;
    margin-top:6px;
}
.step{
    font-size:56px;
    margin-top:10px;
}

/* PREVIEW */
.preview{
    display:flex;
    gap:10px;
    margin-top:16px;
}
.preview div{
    flex:1;
    aspect-ratio:3/4;
    background:var(--sand);
    border-radius:14px;
    padding:6px;
}
.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:10px;
}

/* CONTROLS */
.controls{
    display:flex;
    justify-content:space-around;
    align-items:center;
}
.btn{
    width:78px;
    height:78px;
    border-radius:50%;
    border:1px solid var(--line);
    background:white;
    font-size:11px;
    transition:.2s;
}
.btn:active{
    transform:scale(.95);
}
.btn.main{
    border:2px solid var(--brown);
    box-shadow:0 0 0 7px rgba(138,111,90,.2);
}
.btn:disabled{ opacity:.3; }

/* CANVAS */
canvas{ display:none; }
</style>
</head>

<body>

<!-- IDLE -->
<div class="screen active" id="idle">
    <h1>TOMOPHOTO</h1>
    <p>Beach Photo Booth</p>
    <div class="wave" id="enter">START</div>
</div>

<!-- BOOTH -->
<div class="screen" id="booth">
    <div class="header">
        <h1>TOMOPHOTO</h1>
        <span id="status">READY</span>
    </div>

    <div class="main">
        <div class="camera">
            <video id="video" autoplay playsinline></video>
            <div class="flash" id="flash"></div>
            <div class="countdown" id="countdown">3</div>
        </div>

        <div class="side">
            <div class="state">
                <h2 id="state">READY</h2>
                <p id="hint">Stand in the frame</p>
                <div class="step" id="step">—</div>

                <div class="preview">
                    <div><img id="p1"></div>
                    <div><img id="p2"></div>
                    <div><img id="p3"></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn main" id="shoot">SHOT</button>
                <button class="btn" id="img" disabled>IMAGE</button>
                <button class="btn" id="vid" disabled>VIDEO</button>
                <button class="btn" id="reset" disabled>RESET</button>
            </div>
        </div>
    </div>
</div>

<canvas id="strip"></canvas>
<canvas id="videoCanvas"></canvas>

<script>
/* ===== BASIC ===== */
const idle = document.getElementById("idle");
const booth = document.getElementById("booth");
const video = document.getElementById("video");
const flash = document.getElementById("flash");
const countdown = document.getElementById("countdown");

const previews=[p1,p2,p3];
const strip=document.getElementById("strip");
const sctx=strip.getContext("2d");

const vCanvas=document.getElementById("videoCanvas");
const vctx=vCanvas.getContext("2d");

const shootBtn=shoot;
const imgBtn=img;
const vidBtn=vid;
const resetBtn=reset;

let shots=[];

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(s=>video.srcObject=s);

enter.onclick=()=>{
    idle.classList.remove("active");
    booth.classList.add("active");
};

/* UTIL */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* SHOOT */
shootBtn.onclick=async()=>{
    shots=[];
    previews.forEach(p=>p.src="");
    imgBtn.disabled=true;
    vidBtn.disabled=true;
    resetBtn.disabled=true;

    for(let i=0;i<3;i++){
        countdown.style.display="flex";
        for(let n=3;n>0;n--){
            countdown.textContent=n;
            await sleep(1000);
        }
        countdown.style.display="none";
        flash.style.opacity=1;
        await sleep(100);
        flash.style.opacity=0;

        const c=document.createElement("canvas");
        c.width=video.videoWidth;
        c.height=video.videoHeight;
        c.getContext("2d").drawImage(video,0,0);
        shots.push(c.toDataURL("image/png"));
        previews[i].src=shots[i];
        await sleep(600);
    }

    buildStrip();
    imgBtn.disabled=false;
    vidBtn.disabled=false;
    resetBtn.disabled=false;
};

/* STRIP */
function buildStrip(){
    const img=new Image();
    img.src=shots[0];
    img.onload=()=>{
        const w=img.width;
        const h=img.height;
        const pad=26;
        const head=120;

        strip.width=w+pad*2;
        strip.height=head+h*3+pad*4;

        sctx.fillStyle="#fff";
        sctx.fillRect(0,0,strip.width,strip.height);
        sctx.fillStyle="#2a2a2a";
        sctx.font="300 36px SF Pro Display";
        sctx.textAlign="center";
        sctx.fillText("TOMOPHOTO",strip.width/2,70);
        sctx.font="300 14px SF Pro Display";
        sctx.fillText(new Date().toLocaleDateString(),strip.width/2,100);

        shots.forEach((src,i)=>{
            const im=new Image();
            im.onload=()=>{
                const y=head+pad+i*(h+pad);
                sctx.strokeStyle="#8a6f5a";
                sctx.lineWidth=1;
                sctx.strokeRect(pad-4,y-4,w+8,h+8);
                sctx.drawImage(im,pad,y,w,h);
            };
            im.src=src;
        });
    };
}

/* IMAGE */
imgBtn.onclick=()=>{
    const a=document.createElement("a");
    a.href=strip.toDataURL("image/png");
    a.download="TOMOPHOTO.png";
    a.click();
};

/* VIDEO – slideshow */
vidBtn.onclick=async()=>{
    const imgs=[];
    for(const src of shots){
        const i=new Image();
        i.src=src;
        await i.decode();
        imgs.push(i);
    }

    vCanvas.width=imgs[0].width;
    vCanvas.height=imgs[0].height;

    const stream=vCanvas.captureStream(30);
    let rec;
    try{
        rec=new MediaRecorder(stream,{mimeType:"video/mp4"});
    }catch{
        rec=new MediaRecorder(stream,{mimeType:"video/webm"});
    }
    const chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.start();

    for(const im of imgs){
        vctx.clearRect(0,0,vCanvas.width,vCanvas.height);
        vctx.globalAlpha=0;
        for(let a=0;a<=1;a+=0.05){
            vctx.globalAlpha=a;
            vctx.drawImage(im,0,0);
            await sleep(50);
        }
        await sleep(1500);
    }

    rec.stop();
    rec.onstop=()=>{
        const blob=new Blob(chunks,{type:rec.mimeType});
        const a=document.createElement("a");
        a.href=URL.createObjectURL(blob);
        a.download=rec.mimeType.includes("mp4")?"TOMOPHOTO.mp4":"TOMOPHOTO.webm";
        a.click();
    };
};

resetBtn.onclick=()=>location.reload();
</script>

</body>
</html>

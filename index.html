<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMOPHOTO</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#eaf6fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* ตัวตู้ */
.booth{
  width:440px;
  background:#fff;
  border-radius:24px;
  padding:16px;
  box-shadow:0 24px 50px rgba(0,0,0,.2);
}

/* ชื่อร้าน */
.header{
  text-align:center;
  font-size:14px;
  letter-spacing:2px;
  color:#444;
  margin-bottom:8px;
}

/* จอกล้อง */
.screen{
  position:relative;
  border-radius:20px;
  overflow:hidden;
  background:#000;
}

video{
  width:100%;
  display:block;
}

/* เลขนับ */
.countdown{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:80px;
  font-weight:600;
  color:white;
  background:rgba(0,0,0,.4);
  display:none;
}

/* พรีวิว */
.previews{
  display:flex;
  justify-content:space-between;
  margin-top:12px;
}

.preview{
  width:30%;
  aspect-ratio:3/4;
  border-radius:12px;
  border:2px solid #ddd;
  background:#f5f5f5;
  overflow:hidden;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ปุ่ม */
.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
}

/* ชัตเตอร์ */
.shutter{
  width:76px;
  height:76px;
  border-radius:50%;
  background:white;
  border:7px solid #e0e0e0;
  cursor:pointer;
}

.shutter:active{transform:scale(.94)}

/* ปุ่มเล็ก */
.btn{
  padding:8px 14px;
  border-radius:10px;
  border:none;
  background:#f0f0f0;
  cursor:pointer;
  font-size:13px;
}

.btn:hover{background:#e2e2e2}
</style>
</head>

<body>

<div class="booth">
  <div class="header">TOMOPHOTO</div>

  <div class="screen">
    <video id="video" autoplay playsinline></video>
    <div class="countdown" id="countdown">3</div>
  </div>

  <div class="previews">
    <div class="preview"><img id="p1"></div>
    <div class="preview"><img id="p2"></div>
    <div class="preview"><img id="p3"></div>
  </div>

  <div class="controls">
    <button class="btn" id="resetBtn">รีเซ็ต</button>
    <div class="shutter" id="shutter"></div>
    <a class="btn" id="downloadBtn" download="TOMOPHOTO.png">ดาวน์โหลด</a>
  </div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const countdown = document.getElementById("countdown");
const shutter = document.getElementById("shutter");
const resetBtn = document.getElementById("resetBtn");
const downloadBtn = document.getElementById("downloadBtn");

const previews = [
  document.getElementById("p1"),
  document.getElementById("p2"),
  document.getElementById("p3")
];

let shot = 0;
let lastImage = null;

/* เปิดกล้อง */
navigator.mediaDevices.getUserMedia({video:true})
.then(stream => video.srcObject = stream);

/* หน่วงเวลา */
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ถ่าย */
async function takePhoto(){
  if(shot >= 3) return;

  countdown.style.display="flex";
  for(let i=3;i>0;i--){
    countdown.textContent=i;
    await sleep(700);
  }
  countdown.style.display="none";

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0);

  lastImage = canvas.toDataURL("image/png");
  previews[shot].src = lastImage;

  if(shot === 2){
    downloadBtn.href = lastImage;
  }

  shot++;
}

/* รีเซ็ต */
resetBtn.onclick = ()=>{
  shot = 0;
  previews.forEach(p=>p.src="");
  downloadBtn.removeAttribute("href");
};

shutter.onclick = takePhoto;
</script>

</body>
</html>

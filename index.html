<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMOPHOTO KIOSK</title>

<style>
:root{
    --bg:#f6f4f1;
    --ink:#222;
    --soft:#b9afa6;
    --line:#e1dbd4;
    --accent:#8d7a6a;
}

/* ===== RESET & FONT ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
        "SF Pro Display",
        "Helvetica Neue",
        "Inter",
        system-ui,
        sans-serif;
    font-weight:300;
}

body{
    background:#000;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* ===== KIOSK ===== */
.kiosk{
    width:100%;
    height:100%;
    background:var(--bg);
    display:flex;
    flex-direction:column;
}

/* ===== HEADER ===== */
.header{
    padding:24px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.header h1{
    letter-spacing:6px;
    font-size:26px;
}
.header span{
    font-size:12px;
    opacity:.6;
}

/* ===== MAIN ===== */
.main{
    flex:1;
    display:grid;
    grid-template-columns: 1.4fr 1fr;
    gap:32px;
    padding:0 40px 40px;
}

/* ===== CAMERA ===== */
.camera{
    position:relative;
    background:#000;
    border-radius:28px;
    overflow:hidden;
}
video{
    width:100%;
    height:100%;
    object-fit:cover;
}
.flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
}

/* COUNTDOWN */
.countdown{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    font-size:200px;
    color:white;
    background:rgba(0,0,0,.35);
}

/* ===== SIDE PANEL ===== */
.side{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.state{
    border:1px solid var(--line);
    border-radius:22px;
    padding:24px;
}
.state h2{
    font-size:22px;
    letter-spacing:4px;
}
.state p{
    margin-top:8px;
    font-size:14px;
    opacity:.6;
}
.step{
    margin-top:20px;
    font-size:72px;
}

/* PREVIEW */
.preview{
    display:flex;
    gap:12px;
    margin-top:20px;
}
.preview div{
    flex:1;
    aspect-ratio:3/4;
    background:#eee;
    border-radius:16px;
    overflow:hidden;
}
.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===== CONTROLS ===== */
.controls{
    display:flex;
    justify-content:space-around;
    align-items:center;
}
.btn{
    width:100px;
    height:100px;
    border-radius:50%;
    border:1px solid var(--line);
    background:white;
    font-size:12px;
}
.btn.main{
    border:2px solid var(--accent);
    box-shadow:0 0 0 10px rgba(141,122,106,.15);
}
.btn:disabled{
    opacity:.3;
}
</style>
</head>

<body>

<div class="kiosk">

    <div class="header">
        <h1>TOMOPHOTO</h1>
        <span id="clock">READY</span>
    </div>

    <div class="main">

        <!-- CAMERA -->
        <div class="camera">
            <video id="video" autoplay playsinline></video>
            <div class="flash" id="flash"></div>
            <div class="countdown" id="countdown">3</div>
        </div>

        <!-- SIDE -->
        <div class="side">
            <div class="state">
                <h2 id="state">TOUCH TO START</h2>
                <p id="hint">Place yourself in the frame</p>
                <div class="step" id="step">—</div>

                <div class="preview">
                    <div><img id="p1"></div>
                    <div><img id="p2"></div>
                    <div><img id="p3"></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn main" id="start">START</button>
                <button class="btn" id="img" disabled>IMAGE</button>
                <button class="btn" id="vid" disabled>VIDEO</button>
                <button class="btn" id="reset" disabled>RESET</button>
            </div>
        </div>

    </div>
</div>

<script>
const video = document.getElementById("video");
const countdown = document.getElementById("countdown");
const flash = document.getElementById("flash");

const stateEl = document.getElementById("state");
const stepEl = document.getElementById("step");

const previews=[
    document.getElementById("p1"),
    document.getElementById("p2"),
    document.getElementById("p3")
];

const startBtn=document.getElementById("start");
const imgBtn=document.getElementById("img");
const vidBtn=document.getElementById("vid");
const resetBtn=document.getElementById("reset");

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

let shots=[];

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(s=>video.srcObject=s);

/* UTIL */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function shoot(){
    shots=[];
    previews.forEach(p=>p.src="");
    stateEl.textContent="SHOOTING";
    stepEl.textContent="";

    for(let i=0;i<3;i++){
        stepEl.textContent=i+1;
        countdown.style.display="flex";

        for(let n=3;n>0;n--){
            countdown.textContent=n;
            await sleep(1000);
        }

        countdown.style.display="none";
        flash.style.opacity=1;
        await sleep(100);
        flash.style.opacity=0;

        canvas.width=video.videoWidth;
        canvas.height=video.videoHeight;
        ctx.drawImage(video,0,0);

        shots.push(canvas.toDataURL());
        previews[i].src=shots[i];
        await sleep(500);
    }

    stateEl.textContent="DONE";
    stepEl.textContent="✓";
    imgBtn.disabled=false;
    vidBtn.disabled=false;
    resetBtn.disabled=false;
}

startBtn.onclick=shoot;
resetBtn.onclick=()=>location.reload();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TOMOPHOTO</title>

<style>
:root{
  --cream:#fdfaf6;
  --paper:#fffdfa;
  --brown:#6b4b35;
  --soft:#cbb6a0;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:var(--brown);
}

.booth{
  background:var(--paper);
  width:420px;
  padding:18px;
  border-radius:18px;
  box-shadow:0 15px 40px rgba(0,0,0,.15);
  text-align:center;
}

h1{
  margin:4px 0 12px;
  letter-spacing:3px;
  font-weight:500;
}

.camera-frame{
  border:4px solid var(--brown);
  border-radius:14px;
  overflow:hidden;
}

video{
  width:100%;
  display:block;
}

.counter{
  font-size:64px;
  margin:10px 0;
  font-weight:600;
}

.controls{
  margin-top:12px;
}

button{
  background:var(--brown);
  color:white;
  border:none;
  border-radius:50px;
  padding:12px 22px;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.result{
  margin-top:18px;
  background:#f6f1eb;
  padding:14px;
  border-radius:14px;
}

.result img{
  width:100%;
  border-radius:10px;
  border:4px solid white;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.download{
  display:inline-block;
  margin-top:12px;
  padding:10px 20px;
  background:var(--soft);
  color:#fff;
  text-decoration:none;
  border-radius:30px;
  opacity:.4;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="booth">
  <h1>TOMOPHOTO</h1>

  <div class="camera-frame">
    <video id="video" autoplay playsinline></video>
  </div>

  <div class="counter" id="counter"> </div>

  <div class="controls">
    <button id="startBtn">เริ่มถ่าย</button>
  </div>

  <div class="result">
    <img id="resultImg">
    <a id="downloadBtn" class="download" download="TOMOPHOTO.png">ดาวน์โหลดรูป</a>
  </div>
</div>

<canvas id="canvas" hidden></canvas>
<canvas id="finalCanvas" hidden></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const finalCanvas = document.getElementById("finalCanvas");
const counter = document.getElementById("counter");
const startBtn = document.getElementById("startBtn");
const resultImg = document.getElementById("resultImg");
const downloadBtn = document.getElementById("downloadBtn");

let shots = [];

// เปิดกล้อง
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>video.srcObject=stream)
.catch(()=>alert("ไม่สามารถเปิดกล้องได้"));

// นับถอยหลัง
function countdown(sec){
  return new Promise(res=>{
    let n = sec;
    counter.textContent = n;
    const t = setInterval(()=>{
      n--;
      counter.textContent = n>0?n:"";
      if(n<=0){ clearInterval(t); res(); }
    },1000);
  });
}

// ถ่ายรูป
function snap(){
  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0);
  shots.push(canvas.toDataURL("image/png"));
}

// รวมรูปเป็นแถบยาว
async function buildFinal(){
  const ctx = finalCanvas.getContext("2d");
  finalCanvas.width = 420;
  finalCanvas.height = 1200;

  ctx.fillStyle="#fffdfa";
  ctx.fillRect(0,0,420,1200);

  const images = await Promise.all(
    shots.map(src=>new Promise(res=>{
      const img=new Image();
      img.onload=()=>res(img);
      img.src=src;
    }))
  );

  images.forEach((img,i)=>{
    ctx.drawImage(img,30,40+i*360,360,300);
    ctx.strokeStyle="#ddd2c4";
    ctx.lineWidth=2;
    ctx.strokeRect(30,40+i*360,360,300);
  });

  ctx.fillStyle="#6b4b35";
  ctx.font="20px sans-serif";
  ctx.textAlign="center";
  ctx.fillText("TOMOPHOTO",210,1160);

  const url = finalCanvas.toDataURL("image/png");
  resultImg.src = url;
  downloadBtn.href = url;
  downloadBtn.style.opacity="1";
  downloadBtn.style.pointerEvents="auto";
}

// ปุ่มเริ่ม
startBtn.onclick = async ()=>{
  shots=[];
  startBtn.disabled=true;
  for(let i=0;i<3;i++){
    await countdown(3);
    snap();
  }
  await buildFinal();
  startBtn.disabled=false;
};
</script>

</body>
</html>

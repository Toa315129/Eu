<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMOPHOTO BOOTH</title>

<style>
:root{
  --cream:#fdfaf6;
  --paper:#fffdfa;
  --brown:#6b4b35;
  --soft:#b89a7d;
  --line:#e6dccf;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:var(--brown);
}

.booth{
  width:100%;
  max-width:460px;
  background:#fff;
  border-radius:18px;
  padding:16px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
  text-align:center;
}

h1{
  margin:6px 0 10px;
  letter-spacing:2px;
  font-size:20px;
}

.preview{
  position:relative;
}

video{
  width:100%;
  border-radius:14px;
  border:4px solid var(--brown);
  background:#000;
}

.countdown{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:96px;
  font-weight:600;
  color:#fff;
  background:rgba(0,0,0,.45);
  border-radius:14px;
}

/* ปุ่มตู้จริง */
.controls{
  margin:16px 0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:22px;
}

.booth-btn{
  width:110px;
  height:110px;
  border-radius:50%;
  border:none;
  background:#7a5c3c;
  color:#fff;
  font-size:16px;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:
    0 8px 0 #5a402a,
    0 16px 30px rgba(0,0,0,.25);
  transition:.12s;
}

.booth-btn:active{
  transform:translateY(6px);
  box-shadow:
    0 2px 0 #5a402a,
    0 6px 12px rgba(0,0,0,.25);
}

.booth-btn.small{
  width:64px;
  height:64px;
  font-size:14px;
  background:var(--soft);
  box-shadow:
    0 5px 0 #8d7a64,
    0 10px 20px rgba(0,0,0,.2);
}

/* พรีวิวแถบยาว */
.result-preview{
  background:var(--cream);
  padding:14px;
  border-radius:14px;
  box-shadow:inset 0 0 0 2px var(--line);
}

.result-preview img{
  width:100%;
  max-width:260px;
  border-radius:10px;
  border:4px solid #fff;
  box-shadow:0 6px 20px rgba(0,0,0,.18);
}

.download{
  margin-top:12px;
  display:inline-block;
  padding:10px 22px;
  border-radius:999px;
  background:#6f533f;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  opacity:.4;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="booth">
  <h1>TOMOPHOTO</h1>

  <div class="preview">
    <video id="video" autoplay playsinline></video>
    <div class="countdown" id="countdown">3</div>
  </div>

  <canvas id="canvas" hidden></canvas>
  <canvas id="finalCanvas" hidden></canvas>

  <div class="controls">
    <button id="switchBtn" class="booth-btn small">↺</button>
    <button id="takeBtn" class="booth-btn">TAKE</button>
    <button id="downloadBtn" class="booth-btn small">↓</button>
  </div>

  <div class="result-preview">
    <img id="resultStrip">
  </div>

  <a id="downloadLink" class="download" download="TOMOPHOTO.png">
    DOWNLOAD
  </a>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const finalCanvas = document.getElementById("finalCanvas");
const countdownEl = document.getElementById("countdown");

const takeBtn = document.getElementById("takeBtn");
const switchBtn = document.getElementById("switchBtn");
const downloadBtn = document.getElementById("downloadBtn");
const downloadLink = document.getElementById("downloadLink");
const resultStrip = document.getElementById("resultStrip");

let devices=[], camIndex=0, stream=null, shots=[];

async function startCamera(){
  devices = (await navigator.mediaDevices.enumerateDevices())
    .filter(d=>d.kind==="videoinput");
  stream = await navigator.mediaDevices.getUserMedia({
    video:{deviceId:devices[camIndex].deviceId}
  });
  video.srcObject = stream;
}

switchBtn.onclick = async ()=>{
  camIndex = (camIndex+1)%devices.length;
  if(stream) stream.getTracks().forEach(t=>t.stop());
  await startCamera();
};

function countdown(){
  return new Promise(res=>{
    let n=3;
    countdownEl.textContent=n;
    countdownEl.style.display="flex";
    const i=setInterval(()=>{
      n--;
      if(n===0){
        clearInterval(i);
        countdownEl.style.display="none";
        res();
      }else{
        countdownEl.textContent=n;
      }
    },1000);
  });
}

takeBtn.onclick = async ()=>{
  takeBtn.disabled=true;
  shots=[];

  for(let i=0;i<3;i++){
    await countdown();
    snap();
    await new Promise(r=>setTimeout(r,300));
  }

  buildFinal();
  takeBtn.disabled=false;
};

function snap(){
  const ctx = canvas.getContext("2d");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0);
  shots.push(canvas.toDataURL("image/png"));
}

function buildFinal(){
  const ctx = finalCanvas.getContext("2d");
  finalCanvas.width = 420;
  finalCanvas.height = 1200;

  ctx.fillStyle = "#fffdfa";
  ctx.fillRect(0,0,420,1200);

  shots.forEach((src,i)=>{
    const img = new Image();
    img.onload=()=>{
      ctx.drawImage(img,30,40+i*360,360,300);
      ctx.strokeStyle="#ddd2c4";
      ctx.lineWidth=2;
      ctx.strokeRect(30,40+i*360,360,300);
    };
    img.src=src;
  });

  // grain กระดาษ
  ctx.globalAlpha=.05;
  for(let i=0;i<4000;i++){
    ctx.fillRect(Math.random()*420,Math.random()*1200,1,1);
  }
  ctx.globalAlpha=1;

  ctx.fillStyle="#6b4b35";
  ctx.font="20px sans-serif";
  ctx.textAlign="center";
  ctx.fillText("TOMOPHOTO",210,1160);

  const url = finalCanvas.toDataURL("image/png");
  resultStrip.src = url;
  downloadLink.href = url;
  downloadLink.style.opacity="1";
  downloadLink.style.pointerEvents="auto";
}

downloadBtn.onclick=()=>downloadLink.click();
startCamera();
</script>

</body>
</html>

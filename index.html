<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMOPHOTO</title>

<!-- =========================
     GLOBAL STYLE
========================= -->
<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* BODY */
body{
  height:100vh;
  background:#f2f2f2;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* =========================
     BOOTH SHELL
========================= */
.booth{
  width:440px;
  background:#ffffff;
  border-radius:28px;
  padding:16px;
  box-shadow:0 25px 60px rgba(0,0,0,.25);
}

/* HEADER */
.header{
  text-align:center;
  font-size:14px;
  letter-spacing:3px;
  color:#444;
  margin-bottom:10px;
}

/* =========================
     CAMERA SCREEN
========================= */
.screen{
  position:relative;
  border-radius:20px;
  overflow:hidden;
  background:#000;
}

video{
  width:100%;
  display:block;
}

/* COUNTDOWN OVERLAY */
.countdown{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:96px;
  font-weight:700;
  color:#fff;
  background:rgba(0,0,0,.45);
  display:none;
}

/* =========================
     PREVIEW STRIP
========================= */
.previews{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.preview{
  flex:1;
  aspect-ratio:3/4;
  border-radius:14px;
  border:2px solid #ddd;
  overflow:hidden;
  background:#eee;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =========================
     CONTROLS
========================= */
.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
}

/* SHUTTER BUTTON */
.shutter{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#fff;
  border:8px solid #ddd;
  cursor:pointer;
  transition:transform .1s;
}

.shutter:active{
  transform:scale(.94);
}

/* SIDE BUTTON */
.btn{
  padding:8px 14px;
  border-radius:10px;
  border:none;
  background:#f0f0f0;
  font-size:13px;
  cursor:pointer;
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

</style>
</head>

<body>

<!-- =========================
     BOOTH UI
========================= -->
<div class="booth">

  <div class="header">TOMOPHOTO</div>

  <div class="screen">
    <video id="video" autoplay playsinline></video>
    <div class="countdown" id="countdown">3</div>
  </div>

  <div class="previews">
    <div class="preview"><img id="p1"></div>
    <div class="preview"><img id="p2"></div>
    <div class="preview"><img id="p3"></div>
  </div>

  <div class="controls">
    <button class="btn" id="resetBtn">รีเซ็ต</button>
    <div class="shutter" id="shutter"></div>
    <a class="btn" id="downloadBtn" download="TOMOPHOTO.png" disabled>
      ดาวน์โหลด
    </a>
  </div>

</div>

<!-- CANVAS -->
<canvas id="canvas" hidden></canvas>

<!-- =========================
     SCRIPT LOGIC
========================= -->
<script>

/* =========================
   DOM REFERENCES
========================= */
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const countdown = document.getElementById("countdown");
const shutter = document.getElementById("shutter");
const resetBtn = document.getElementById("resetBtn");
const downloadBtn = document.getElementById("downloadBtn");

const previews = [
  document.getElementById("p1"),
  document.getElementById("p2"),
  document.getElementById("p3")
];

/* =========================
   STATE
========================= */
let isBusy = false;
let images = [];

/* =========================
   UTILS
========================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* =========================
   CAMERA INIT
========================= */
async function initCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;
  }catch(err){
    alert("ไม่สามารถเปิดกล้องได้");
  }
}

/* =========================
   AUTO SHOOT LOGIC
========================= */
async function autoShoot(){

  if(isBusy) return;
  isBusy = true;

  images = [];
  previews.forEach(p => p.src = "");
  downloadBtn.setAttribute("disabled", true);

  for(let i=0;i<3;i++){

    countdown.style.display="flex";

    for(let n=3;n>0;n--){
      countdown.textContent = n;
      await sleep(700);
    }

    countdown.style.display="none";

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video,0,0);

    const img = canvas.toDataURL("image/png");
    images.push(img);
    previews[i].src = img;

    await sleep(500);
  }

  downloadBtn.href = images[2];
  downloadBtn.removeAttribute("disabled");
  isBusy = false;
}

/* =========================
   RESET
========================= */
function resetBooth(){
  images = [];
  previews.forEach(p => p.src = "");
  downloadBtn.setAttribute("disabled", true);
  isBusy = false;
}

/* =========================
   EVENTS
========================= */
shutter.onclick = autoShoot;
resetBtn.onclick = resetBooth;

/* =========================
   START
========================= */
initCamera();

</script>

</body>
</html>
